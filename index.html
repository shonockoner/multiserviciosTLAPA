<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parte dos de la fuente madre</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f5f5f5;
    }

    /* ===== ENCABEZADO ===== */
    header {
      background: linear-gradient(135deg, #2563eb, #1e40af);
      color: white;
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      font-size: 16px;
    }

    /* ===== GRID SECCIONES ===== */
    .secciones {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 40px;
      max-width: 1200px;
      margin: auto;
    }

    @media (max-width: 900px) {
      .secciones {
        grid-template-columns: repeat(2, 1fr);
      }

      header {
        flex-direction: column;
        align-items: flex-start;
      }
    }

    @media (max-width: 600px) {
      .secciones {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    /* ===== TARJETAS ===== */
    .card {
      position: relative;
      height: 260px;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 6px 15px rgba(0,0,0,0.1);
      cursor: pointer;

      /* CLAVE PARA LINKS */
      text-decoration: none;
      color: inherit;
      display: block;
    }

    .card img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;

      /* CLAVE PARA QUE EL <a> RECIBA EL CLICK */
      pointer-events: none;
    }

    .card h3 {
      position: absolute;
      bottom: 0;
      width: 100%;
      margin: 0;
      padding: 14px 0;
      font-size: 18px;
      color: white;
      background: rgba(0,0,0,0.45);
      text-align: center;
      z-index: 1;
    }

    /* Hover */
    .card:hover img {
      transform: scale(1.1);
      transition: transform 0.4s ease;
    }

    .card:hover h3 {
      background: rgba(0,0,0,0.65);
    }
  </style>
</head>

<body>

  <!-- ===== ENCABEZADO ===== -->
  <header>
    <h1>Parte dos de la fuente madre</h1>
    <nav>
      <a href="#">Inicio</a>
      <a href="#">Servicios</a>
      <a href="#">Negocios</a>
      <a href="#">Contacto</a>
    </nav>
  </header>

  <!-- ===== SECCIONES ===== -->
  <section class="secciones">

    <a class="card">
      <img src="imagenes/mercado.jpg" alt="Mercado">
      <h3>Mercado</h3>
    </a>

    <a class="card">
      <img src="imagenes/servicios.jpg" alt="Servicios">
      <h3>Servicios</h3>
    </a>

    <!-- 🔴 ESTA ES LA IMPORTANTE -->
    <a href="telefonia.html" class="card">
      <img src="imagenes/telefonia.jpg" alt="Telefonía">
      <h3>Telefonía</h3>
    </a>

    <a class="card">
      <img src="imagenes/mayoreo.jpg" alt="Mayoreo">
      <h3>Mayoreo</h3>
    </a>

    <a class="card">
      <img src="imagenes/transporte.jpg" alt="Transporte">
      <h3>Transporte</h3>
    </a>

    <a class="card">
      <img src="imagenes/ofertas.jpg" alt="Ofertas">
      <h3>Ofertas</h3>
    </a>

  </section>

</body>
</html>
